<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.Sc. Custom Question Bank & Study Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' },
                        secondary: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .markdown-body h1 { @apply text-2xl font-bold mt-6 mb-4 text-gray-800; }
        .markdown-body h2 { @apply text-xl font-bold mt-5 mb-3 text-gray-800 border-b border-gray-200 pb-2; }
        .markdown-body h3 { @apply text-lg font-semibold mt-4 mb-2 text-gray-700; }
        .markdown-body p { @apply mb-4 text-gray-600 leading-relaxed; }
        .markdown-body ul { @apply list-disc pl-6 mb-4 text-gray-600 space-y-1; }
        .markdown-body ol { @apply list-decimal pl-6 mb-4 text-gray-600 space-y-1; }
        .markdown-body strong { @apply font-semibold text-gray-800; }
        
        .tab-active { @apply border-primary-600 text-primary-600 font-semibold bg-primary-50; }
        .tab-inactive { @apply border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 hover:bg-gray-50; }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0ea5e9;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans flex flex-col text-slate-800">

    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 text-primary-600">
                <div class="bg-primary-100 p-2 rounded-lg">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">S.Sc. Study Hub</h1>
            </div>
            <div class="flex items-center gap-2 text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">
                <i class="fa-solid fa-wand-magic-sparkles text-secondary-500"></i> AI Powered
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col lg:flex-row gap-6">
        
        <div class="w-full lg:w-1/3 flex flex-col gap-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sticky top-24">
                <h2 class="text-lg font-bold text-slate-800 mb-1">Study Setup</h2>
                <p class="text-slate-500 text-sm mb-6">Define your topic and customize the output.</p>
                
                <div class="mb-5">
                    <label for="topicInput" class="block text-sm font-semibold text-slate-700 mb-1.5">Topic</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-book-open text-slate-400"></i>
                        </div>
                        <input type="text" id="topicInput" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm" placeholder="e.g., French Revolution, Democracy">
                    </div>
                </div>

                <div class="space-y-4 bg-slate-50 p-4 rounded-lg border border-slate-100 mb-6">
                    <h3 class="text-xs uppercase font-bold text-slate-500 tracking-wider">Parameters</h3>
                    
                    <div>
                        <label for="noteDetail" class="block text-sm font-medium text-slate-700 mb-1">Notes Detailing</label>
                        <select id="noteDetail" class="block w-full border border-slate-300 rounded-md py-2 px-3 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-white">
                            <option value="brief">Brief (Quick Revision)</option>
                            <option value="standard" selected>Standard (Balanced)</option>
                            <option value="comprehensive">Comprehensive (In-depth)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="quizDifficulty" class="block text-sm font-medium text-slate-700 mb-1">Difficulty</label>
                            <select id="quizDifficulty" class="block w-full border border-slate-300 rounded-md py-2 px-3 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-white">
                                <option value="easy">Easy</option>
                                <option value="medium" selected>Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                        </div>
                        <div>
                            <label for="numQuestions" class="block text-sm font-medium text-slate-700 mb-1">Questions</label>
                            <input type="number" id="numQuestions" value="5" min="1" max="20" class="block w-full border border-slate-300 rounded-md py-2 px-3 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-white">
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button onclick="generateContent('notes')" class="w-full flex items-center justify-center gap-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 py-2.5 px-4 rounded-lg shadow-sm transition-all font-medium">
                        <i class="fa-regular fa-note-sticky text-yellow-500"></i> Generate Notes
                    </button>
                    <button onclick="generateContent('questions')" class="w-full flex items-center justify-center gap-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 py-2.5 px-4 rounded-lg shadow-sm transition-all font-medium">
                        <i class="fa-solid fa-bolt text-orange-500"></i> Important Qs
                    </button>
                    <button onclick="generateContent('quiz')" class="w-full flex items-center justify-center gap-2 bg-primary-600 hover:bg-primary-700 text-white py-2.5 px-4 rounded-lg shadow-sm transition-all font-medium">
                        <i class="fa-solid fa-list-check"></i> Create Quiz
                    </button>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-2/3 flex flex-col">
            
            <div id="loadingIndicator" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-12 flex flex-col items-center justify-center mb-6 h-full min-h-[400px]">
                <div class="loader mb-4"></div>
                <p id="loadingMessage" class="text-base font-medium text-slate-700 animate-pulse">Generating...</p>
            </div>

            <div id="resultsContainer" class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full hidden">
                <div class="border-b border-slate-200 rounded-t-xl overflow-hidden bg-slate-50/50">
                    <nav class="flex overflow-x-auto hide-scrollbar" aria-label="Tabs" id="tabsNav">
                        <button onclick="switchTab('notes')" id="tab-notes" class="tab-inactive whitespace-nowrap py-4 px-6 border-b-2 font-medium text-sm transition-colors flex items-center gap-2 flex-1 justify-center">
                            <i class="fa-regular fa-note-sticky"></i> Notes
                        </button>
                        <button onclick="switchTab('questions')" id="tab-questions" class="tab-inactive whitespace-nowrap py-4 px-6 border-b-2 font-medium text-sm transition-colors flex items-center gap-2 flex-1 justify-center">
                            <i class="fa-solid fa-bolt"></i> Exam Qs
                        </button>
                        <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-inactive whitespace-nowrap py-4 px-6 border-b-2 font-medium text-sm transition-colors flex items-center gap-2 flex-1 justify-center">
                            <i class="fa-solid fa-list-check"></i> Quiz
                        </button>
                    </nav>
                </div>

                <div class="p-6 md:p-8 flex-grow">
                    <!-- Notes Tab -->
                    <div id="content-notes" class="hidden h-full flex flex-col">
                        <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                            <h3 class="text-xl font-bold text-slate-800">Study Notes</h3>
                            <button onclick="copyToClipboard('notesOutput')" class="text-slate-400 hover:text-primary-600 bg-slate-50 p-2 rounded">
                                <i class="fa-regular fa-copy text-lg"></i>
                            </button>
                        </div>
                        <div id="notesOutput" class="markdown-body flex-grow"></div>
                    </div>

                    <!-- Questions Tab -->
                    <div id="content-questions" class="hidden h-full flex flex-col">
                         <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                            <h3 class="text-xl font-bold text-slate-800">Exam Questions</h3>
                            <button onclick="copyToClipboard('questionsOutput')" class="text-slate-400 hover:text-primary-600 bg-slate-50 p-2 rounded">
                                <i class="fa-regular fa-copy text-lg"></i>
                            </button>
                        </div>
                        <div id="questionsOutput" class="markdown-body flex-grow"></div>
                    </div>

                    <!-- Quiz Tab -->
                    <div id="content-quiz" class="hidden h-full flex flex-col">
                        <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                            <h3 class="text-xl font-bold text-slate-800">Interactive Quiz</h3>
                            <span id="quizScoreDisplay" class="hidden bg-green-100 text-green-800 text-sm font-bold px-4 py-1.5 rounded-full"></span>
                        </div>
                        <div id="quizContainer" class="space-y-6 flex-grow"></div>
                        <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                            <button id="submitQuizBtn" onclick="evaluateQuiz()" class="hidden bg-primary-600 hover:bg-primary-700 text-white font-medium py-2.5 px-8 rounded-lg shadow-sm">
                                Submit
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center h-full min-h-[400px] text-center p-8">
                <div class="bg-primary-50 p-5 rounded-full mb-5 text-primary-400">
                    <i class="fa-solid fa-shapes text-5xl"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-2">Ready to Study?</h3>
                <p class="text-slate-500 text-sm max-w-md">Enter a topic, adjust your settings, and click a generate button to start.</p>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script>
        let currentQuizData = null;
        let generatedContentCount = 0;

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-opacity duration-300 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> <span class="text-sm font-medium">${message}</span>`;
            
            document.getElementById('toastContainer').appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('opacity-0'));
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        function switchTab(tabId) {
            ['notes', 'questions', 'quiz'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const content = document.getElementById(`content-${t}`);
                if (t === tabId) {
                    btn.classList.replace('tab-inactive', 'tab-active');
                    content.classList.remove('hidden');
                } else {
                    btn.classList.replace('tab-active', 'tab-inactive');
                    content.classList.add('hidden');
                }
            });
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard!");
            }).catch(() => {
                // Fallback
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                showToast("Copied to clipboard!");
            });
        }

        async function fetchFromGemini(prompt, isJSON = false) {
            // Updated Hardcoded AQ API Key & Endpoint
            const API_KEY = "AQ.Ab8RN6KSVezqQoaRsi6hX3V4ewyb6Soffus5xCZcR505j8Y5RA";
            const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            if (isJSON) {
                payload.generationConfig = { responseMimeType: "application/json" };
            }

            try {
                const response = await fetch(ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} - Request blocked or failed. Are you running on localhost?`);
                }

                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (error) {
                console.error("API Fetch Error:", error);
                throw error;
            }
        }

        async function generateContent(type) {
            const topic = document.getElementById('topicInput').value.trim();
            if (!topic) return showToast("Please enter a topic first.", "error");

            const detail = document.getElementById('noteDetail').value;
            const diff = document.getElementById('quizDifficulty').value;
            const count = parseInt(document.getElementById('numQuestions').value) || 5;

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('loadingMessage').innerText = `Generating ${type}...`;

            let prompt = "";
            let isJSON = false;

            if (type === 'notes') {
                prompt = `You are a Social Science teacher. Topic: '${topic}'. Detail level: ${detail}. Create organized study notes using Markdown. Use headings and bullet points.`;
            } else if (type === 'questions') {
                prompt = `You are a Social Science examiner. Generate exactly ${count} highly probable 'last-minute' review questions on '${topic}'. Difficulty: ${diff}. Provide hints/key points for each answer. Use Markdown formatting.`;
            } else if (type === 'quiz') {
                prompt = `You are a Social Science teacher. Create a multiple-choice quiz on '${topic}'. Difficulty: ${diff}. Output EXACTLY a JSON array of ${count} objects. Schema: [{"question": "string", "options": ["A","B","C","D"], "answer": "Exact string from options", "explanation": "string"}]. Do not include markdown code blocks around the JSON.`;
                isJSON = true;
            }

            try {
                const responseText = await fetchFromGemini(prompt, isJSON);
                
                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('resultsContainer').classList.remove('hidden');
                generatedContentCount++;

                if (type === 'notes') {
                    document.getElementById('notesOutput').innerHTML = marked.parse(responseText);
                    switchTab('notes');
                } else if (type === 'questions') {
                    document.getElementById('questionsOutput').innerHTML = marked.parse(responseText);
                    switchTab('questions');
                } else if (type === 'quiz') {
                    // Clean potential markdown blocks if AI didn't follow strict JSON output rule
                    let jsonStr = responseText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const quizData = JSON.parse(jsonStr);
                    buildQuizUI(quizData);
                    switchTab('quiz');
                }
            } catch (error) {
                document.getElementById('loadingIndicator').classList.add('hidden');
                if(generatedContentCount === 0) document.getElementById('emptyState').classList.remove('hidden');
                else document.getElementById('resultsContainer').classList.remove('hidden');
                
                showToast("Generation failed. Please ensure you are running via a local server (http://localhost) and not a local file.", "error");
            }
        }

        function buildQuizUI(quizArray) {
            currentQuizData = quizArray;
            const container = document.getElementById('quizContainer');
            container.innerHTML = ''; 
            
            document.getElementById('quizScoreDisplay').classList.add('hidden');
            document.getElementById('submitQuizBtn').classList.remove('hidden');

            quizArray.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = "bg-slate-50 rounded-xl p-5 border border-slate-200";
                
                let optionsHTML = '';
                q.options.forEach((opt, optIndex) => {
                    const safeValue = opt.replace(/"/g, '&quot;');
                    optionsHTML += `
                        <label class="flex items-start gap-3 p-3 rounded-lg border border-slate-200 bg-white cursor-pointer hover:border-primary-300 mb-2">
                            <input name="q${index}" type="radio" value="${safeValue}" class="mt-1">
                            <span class="text-sm text-slate-700">${opt}</span>
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <div class="mb-4">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Question ${index + 1}</span>
                        <h4 class="font-semibold text-slate-800 mt-1">${q.question}</h4>
                    </div>
                    <div class="space-y-2">${optionsHTML}</div>
                    <div id="exp${index}" class="mt-4 p-3 rounded-lg text-sm hidden"></div>
                `;
                container.appendChild(qDiv);
            });
        }

        function evaluateQuiz() {
            if (!currentQuizData) return;
            let score = 0;
            let allAnswered = true;

            currentQuizData.forEach((q, i) => {
                if (!document.querySelector(`input[name="q${i}"]:checked`)) allAnswered = false;
            });

            if(!allAnswered) return showToast("Please answer all questions.", "error");

            currentQuizData.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`).value;
                const expDiv = document.getElementById(`exp${i}`);
                
                document.querySelectorAll(`input[name="q${i}"]`).forEach(input => {
                    input.disabled = true;
                    const lbl = input.closest('label');
                    lbl.classList.remove('cursor-pointer', 'hover:border-primary-300');
                    if (input.value === q.answer) {
                        lbl.classList.add('border-green-400', 'bg-green-50');
                    } else if (input.checked) {
                        lbl.classList.add('border-red-400', 'bg-red-50');
                    }
                });

                expDiv.classList.remove('hidden');
                if (selected === q.answer) {
                    score++;
                    expDiv.classList.add('bg-green-100', 'text-green-800');
                    expDiv.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
                } else {
                    expDiv.classList.add('bg-red-100', 'text-red-800');
                    expDiv.innerHTML = `<strong>Incorrect.</strong> Answer: ${q.answer}.<br>${q.explanation}`;
                }
            });

            document.getElementById('submitQuizBtn').classList.add('hidden');
            const scoreDisp = document.getElementById('quizScoreDisplay');
            scoreDisp.innerText = `Score: ${score}/${currentQuizData.length}`;
            scoreDisp.classList.remove('hidden');
            document.getElementById('tabsNav').scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize empty state defaults
        window.onload = () => document.getElementById('topicInput').focus();
    </script>
</body>
</html>
