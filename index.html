<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.Sc. Custom Question Bank & Study Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' },
                        secondary: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .markdown-body h1 { @apply text-2xl font-bold mt-6 mb-4 text-gray-800; }
        .markdown-body h2 { @apply text-xl font-bold mt-5 mb-3 text-gray-800 border-b border-gray-200 pb-2; }
        .markdown-body h3 { @apply text-lg font-semibold mt-4 mb-2 text-gray-700; }
        .markdown-body p { @apply mb-4 text-gray-600 leading-relaxed; }
        .markdown-body ul { @apply list-disc pl-6 mb-4 text-gray-600 space-y-1; }
        .markdown-body ol { @apply list-decimal pl-6 mb-4 text-gray-600 space-y-1; }
        .markdown-body strong { @apply font-semibold text-gray-800; }
        
        .tab-active { @apply border-primary-600 text-primary-600 font-semibold bg-primary-50; }
        .tab-inactive { @apply border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 hover:bg-gray-50; }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0ea5e9;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

<script>
    let currentQuizData = null;
    let generatedContentCount = 0;

    function showToast(message, type = "info") {
        const toast = document.createElement("div");
        const bgClass = type === "error" ? "bg-red-600" : "bg-slate-800";

        toast.className =
            `${bgClass} text-white px-4 py-3 rounded-lg shadow-lg ` +
            `flex items-center gap-3 transition-opacity duration-300 opacity-0`;

        const icon = document.createElement("i");
        icon.className =
            `fa-solid ${type === "error"
                ? "fa-circle-exclamation"
                : "fa-circle-check"}`;

        const text = document.createElement("span");
        text.className = "text-sm font-medium";
        text.textContent = message;

        toast.appendChild(icon);
        toast.appendChild(text);

        document.getElementById("toastContainer").appendChild(toast);

        requestAnimationFrame(() => {
            toast.classList.remove("opacity-0");
        });

        setTimeout(() => {
            toast.classList.add("opacity-0");

            setTimeout(() => {
                toast.remove();
            }, 300);
        }, 5000);
    }

    function switchTab(tabId) {
        ["notes", "questions", "quiz"].forEach(tab => {
            const button = document.getElementById(`tab-${tab}`);
            const content = document.getElementById(`content-${tab}`);

            if (tab === tabId) {
                button.classList.replace("tab-inactive", "tab-active");
                content.classList.remove("hidden");
            } else {
                button.classList.replace("tab-active", "tab-inactive");
                content.classList.add("hidden");
            }
        });
    }

    function copyToClipboard(elementId) {
        const element = document.getElementById(elementId);
        const text = element.innerText;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text)
                .then(() => showToast("Copied to clipboard!"))
                .catch(() => fallbackCopy(text));

            return;
        }

        fallbackCopy(text);
    }

    function fallbackCopy(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        try {
            document.execCommand("copy");
            showToast("Copied to clipboard!");
        } catch (error) {
            showToast("Unable to copy text.", "error");
        }

        textarea.remove();
    }

    function extractJsonArray(responseText) {
        if (!responseText || typeof responseText !== "string") {
            throw new Error("Gemini returned an empty quiz response.");
        }

        let cleaned = responseText
            .replace(/```json/gi, "")
            .replace(/```/g, "")
            .trim();

        const firstBracket = cleaned.indexOf("[");
        const lastBracket = cleaned.lastIndexOf("]");

        if (firstBracket === -1 || lastBracket === -1) {
            console.error("Quiz response:", responseText);
            throw new Error("The quiz response was not valid JSON.");
        }

        cleaned = cleaned.slice(firstBracket, lastBracket + 1);

        try {
            return JSON.parse(cleaned);
        } catch (error) {
            console.error("Invalid quiz JSON:", cleaned);
            throw new Error("Gemini returned malformed quiz data.");
        }
    }

    function normalizeQuizData(quizData) {
        if (!Array.isArray(quizData)) {
            throw new Error("The quiz response is not an array.");
        }

        if (quizData.length === 0) {
            throw new Error("Gemini returned an empty quiz.");
        }

        return quizData.map((item, index) => {
            if (!item || typeof item !== "object") {
                throw new Error(`Invalid question ${index + 1}.`);
            }

            const question = String(item.question || "").trim();

            const options = Array.isArray(item.options)
                ? item.options
                    .map(option => String(option).trim())
                    .filter(Boolean)
                : [];

            const answer = String(item.answer || "").trim();

            const explanation = String(
                item.explanation || "No explanation was provided."
            ).trim();

            if (!question) {
                throw new Error(`Question ${index + 1} has no question text.`);
            }

            if (options.length !== 4) {
                throw new Error(
                    `Question ${index + 1} must contain exactly four options.`
                );
            }

            const correctOption = options.find(
                option => option.toLowerCase() === answer.toLowerCase()
            );

            if (!correctOption) {
                throw new Error(
                    `The answer for question ${index + 1} does not match an option.`
                );
            }

            return {
                question,
                options,
                answer: correctOption,
                explanation
            };
        });
    }

    async function generateContent(type) {
        const topicInput = document.getElementById("topicInput");
        const topic = topicInput.value.trim();

        if (!topic) {
            showToast("Please enter a topic first.", "error");
            topicInput.focus();
            return;
        }

        const detail = document.getElementById("noteDetail").value;
        const difficulty = document.getElementById("quizDifficulty").value;

        let questionCount =
            parseInt(document.getElementById("numQuestions").value, 10) || 5;

        questionCount = Math.min(Math.max(questionCount, 1), 20);

        document.getElementById("emptyState").classList.add("hidden");
        document.getElementById("resultsContainer").classList.add("hidden");
        document.getElementById("loadingIndicator").classList.remove("hidden");

        document.getElementById("loadingMessage").textContent =
            `Generating ${type}...`;

        let prompt = "";
        let isJSON = false;

        if (type === "notes") {
            prompt = `
You are a Social Science teacher.

Topic: "${topic}"
Detail level: "${detail}"

Create organized study notes using Markdown.
Use clear headings, bullet points, and short explanations.
`;
        }

        if (type === "questions") {
            prompt = `
You are a Social Science examiner.

Generate exactly ${questionCount} important exam-review questions about:
"${topic}"

Difficulty: "${difficulty}"

For each question, provide hints or key points for the answer.
Use Markdown formatting.
`;
        }

        if (type === "quiz") {
            prompt = `
You are a Social Science teacher.

Create exactly ${questionCount} multiple-choice questions about:
"${topic}"

Difficulty: "${difficulty}"

Return ONLY a valid JSON array.
Do not include Markdown.
Do not use a code block.
Do not include any text before or after the JSON.

Use exactly this format:
[
  {
    "question": "Question text",
    "options": [
      "Option A",
      "Option B",
      "Option C",
      "Option D"
    ],
    "answer": "The exact text of the correct option",
    "explanation": "A short explanation"
  }
]

Rules:
- Return exactly ${questionCount} questions.
- Every question must have exactly four options.
- The answer must exactly match one of the four options.
- Do not use option letters such as A, B, C, or D as the answer.
`;

            isJSON = true;
        }

        try {
            const responseText = await fetchFromGemini(prompt, isJSON);

            if (type === "notes") {
                document.getElementById("notesOutput").innerHTML =
                    marked.parse(responseText);

                generatedContentCount++;
                document.getElementById("loadingIndicator").classList.add("hidden");
                document.getElementById("resultsContainer").classList.remove("hidden");
                switchTab("notes");
                return;
            }

            if (type === "questions") {
                document.getElementById("questionsOutput").innerHTML =
                    marked.parse(responseText);

                generatedContentCount++;
                document.getElementById("loadingIndicator").classList.add("hidden");
                document.getElementById("resultsContainer").classList.remove("hidden");
                switchTab("questions");
                return;
            }

            if (type === "quiz") {
                const parsedQuiz = extractJsonArray(responseText);
                const quizData = normalizeQuizData(parsedQuiz);

                buildQuizUI(quizData);

                generatedContentCount++;
                document.getElementById("loadingIndicator").classList.add("hidden");
                document.getElementById("resultsContainer").classList.remove("hidden");
                switchTab("quiz");
            }
        } catch (error) {
            console.error("Generation failed:", error);

            document.getElementById("loadingIndicator").classList.add("hidden");

            if (generatedContentCount === 0) {
                document.getElementById("emptyState").classList.remove("hidden");
            } else {
                document.getElementById("resultsContainer").classList.remove("hidden");
            }

            showToast(
                error.message || "Generation failed. Please try again.",
                "error"
            );
        }
    }

    function buildQuizUI(quizArray) {
        currentQuizData = quizArray;

        const container = document.getElementById("quizContainer");
        container.innerHTML = "";

        document.getElementById("quizScoreDisplay").classList.add("hidden");
        document.getElementById("submitQuizBtn").classList.remove("hidden");

        quizArray.forEach((questionData, questionIndex) => {
            const questionWrapper = document.createElement("div");
            questionWrapper.className =
                "bg-slate-50 rounded-xl p-5 border border-slate-200";

            const questionLabel = document.createElement("span");
            questionLabel.className =
                "text-xs font-bold text-slate-500 uppercase tracking-wider";
            questionLabel.textContent =
                `Question ${questionIndex + 1}`;

            const questionTitle = document.createElement("h4");
            questionTitle.className =
                "font-semibold text-slate-800 mt-1";
            questionTitle.textContent = questionData.question;

            const questionHeader = document.createElement("div");
            questionHeader.className = "mb-4";
            questionHeader.appendChild(questionLabel);
            questionHeader.appendChild(questionTitle);

            const optionsWrapper = document.createElement("div");
            optionsWrapper.className = "space-y-2";

            questionData.options.forEach(option => {
                const label = document.createElement("label");
                label.className =
                    "flex items-start gap-3 p-3 rounded-lg border " +
                    "border-slate-200 bg-white cursor-pointer " +
                    "hover:border-primary-300 mb-2";

                const input = document.createElement("input");
                input.type = "radio";
                input.name = `q${questionIndex}`;
                input.value = option;
                input.className = "mt-1";

                const optionText = document.createElement("span");
                optionText.className = "text-sm text-slate-700";
                optionText.textContent = option;

                label.appendChild(input);
                label.appendChild(optionText);
                optionsWrapper.appendChild(label);
            });

            const explanation = document.createElement("div");
            explanation.id = `exp${questionIndex}`;
            explanation.className =
                "mt-4 p-3 rounded-lg text-sm hidden";

            questionWrapper.appendChild(questionHeader);
            questionWrapper.appendChild(optionsWrapper);
            questionWrapper.appendChild(explanation);

            container.appendChild(questionWrapper);
        });
    }

    function evaluateQuiz() {
        if (!currentQuizData || currentQuizData.length === 0) {
            showToast("Please generate a quiz first.", "error");
            return;
        }

        let allAnswered = true;

        currentQuizData.forEach((question, index) => {
            const selected = document.querySelector(
                `input[name="q${index}"]:checked`
            );

            if (!selected) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            showToast("Please answer all questions.", "error");
            return;
        }

        let score = 0;

        currentQuizData.forEach((question, index) => {
            const selectedInput = document.querySelector(
                `input[name="q${index}"]:checked`
            );

            const selectedAnswer = selectedInput.value;
            const explanation = document.getElementById(`exp${index}`);
            const inputs = document.querySelectorAll(`input[name="q${index}"]`);

            inputs.forEach(input => {
                input.disabled = true;

                const label = input.closest("label");
                label.classList.remove(
                    "cursor-pointer",
                    "hover:border-primary-300"
                );

                if (input.value === question.answer) {
                    label.classList.add(
                        "border-green-400",
                        "bg-green-50"
                    );
                }

                if (
                    input.checked &&
                    input.value !== question.answer
                ) {
                    label.classList.add(
                        "border-red-400",
                        "bg-red-50"
                    );
                }
            });

            explanation.classList.remove("hidden");

            if (selectedAnswer === question.answer) {
                score++;

                explanation.classList.add(
                    "bg-green-100",
                    "text-green-800"
                );

                explanation.innerHTML =
                    `<strong>Correct!</strong> ${question.explanation}`;
            } else {
                explanation.classList.add(
                    "bg-red-100",
                    "text-red-800"
                );

                explanation.innerHTML =
                    `<strong>Incorrect.</strong> ` +
                    `Correct answer: ${question.answer}.<br>` +
                    `${question.explanation}`;
            }
        });

        document.getElementById("submitQuizBtn").classList.add("hidden");

        const scoreDisplay = document.getElementById("quizScoreDisplay");
        scoreDisplay.textContent =
            `Score: ${score}/${currentQuizData.length}`;
        scoreDisplay.classList.remove("hidden");

        document.getElementById("tabsNav").scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }

    window.addEventListener("load", () => {
        document.getElementById("topicInput").focus();
    });
</script>
</body>
</html>
