<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.Sc. Question Bank</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <div class="max-w-4xl mx-auto p-6 md:p-8">
        
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-blue-700 tracking-tight mb-2">S.Sc. Question Bank</h1>
            <p class="text-gray-500 font-medium tracking-wide text-sm">created by R-5 studios</p>
        </header>

        <!-- Configuration Panel -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
            <h2 class="text-xl font-bold text-gray-700 mb-5 border-b pb-2">Configuration</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Topic or Chapter</label>
                    <input type="text" id="config-topic" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="e.g. French Revolution">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Difficulty</label>
                    <select id="config-difficulty" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition text-gray-700">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Number of Questions</label>
                    <input type="number" id="config-quantity" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition" value="5" min="1" max="50">
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col md:flex-row justify-center gap-4 mb-10">
            <button id="btn-quiz" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition transform hover:-translate-y-0.5">
                Create Quiz
            </button>
            <button id="btn-notes" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition transform hover:-translate-y-0.5">
                Create Short Notes
            </button>
            <button id="btn-important" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition transform hover:-translate-y-0.5">
                Last Minute Questions
            </button>
        </div>

        <!-- Output Container -->
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-100 min-h-[300px]" id="output-box">
            <div id="output-content" class="prose max-w-none text-gray-700">
                <p class="text-center text-gray-400 italic mt-10">Configure your settings and click a button above to generate content...</p>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // 1. Connect HTML Elements
            const btnQuiz = document.getElementById("btn-quiz");
            const btnNotes = document.getElementById("btn-notes");
            const btnImportant = document.getElementById("btn-important");
            const outputContent = document.getElementById("output-content");
            const outputBox = document.getElementById("output-box");

            // 2. Direct Groq API Settings
            const API_KEY = "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";
            const ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";
            const MODEL = "openai/gpt-oss-120b";

            // 3. Main Generation Function
            async function generateContent(type) {
                const topic = document.getElementById("config-topic").value || "General Social Science";
                const difficulty = document.getElementById("config-difficulty").value;
                const quantity = document.getElementById("config-quantity").value;

                let prompt = "";
                
                // For the quiz, we force the AI to return a strict JSON structure
                if (type === "quiz") {
                    prompt = `Create a ${quantity}-question multiple choice quiz about the Social Science topic: "${topic}". Difficulty level: ${difficulty}. 
                    You MUST return ONLY a valid JSON array of objects. Do not include markdown, do not include backticks (\`\`\`), and do not include any introductory text. 
                    Structure each object exactly like this:
                    [
                      {
                        "question": "The question text here",
                        "options": ["Option 1", "Option 2", "Option 3", "Option 4"],
                        "correctIndex": 0
                      }
                    ]
                    (Where correctIndex is the integer index 0-3 of the correct answer).`;
                } else if (type === "notes") {
                    prompt = `Create highly detailed, easy-to-read revision short notes on the Social Science topic: "${topic}". Difficulty level: ${difficulty}. Tailor the depth to be roughly equivalent to ${quantity} major bullet points of information. Use clear headings and bold text for important terms.`;
                } else if (type === "important") {
                    prompt = `Provide ${quantity} highly important, frequently asked exam questions for the Social Science topic: "${topic}". Difficulty level: ${difficulty}. Provide the question in bold, followed by a direct, concise answer for last-minute revision.`;
                }

                outputContent.innerHTML = `<div class="flex justify-center items-center h-full mt-10">
                    <p class="text-blue-600 font-bold animate-pulse text-lg">Connecting directly to Groq... Please wait.</p>
                </div>`;
                outputBox.classList.add("ring-2", "ring-blue-400", "ring-offset-2");

                try {
                    const response = await fetch(ENDPOINT, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            model: MODEL,
                            messages: [{ role: "user", content: prompt }]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData?.error?.message || `API Error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    let rawText = data.choices[0].message.content;

                    // If it's a quiz, parse the JSON and build interactive HTML
                    if (type === "quiz") {
                        // Clean up markdown block if the AI ignored instructions
                        rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                        renderInteractiveQuiz(rawText);
                    } else {
                        // If it's notes or questions, just parse standard Markdown
                        outputContent.innerHTML = marked.parse(rawText);
                    }
                    
                } catch (error) {
                    console.error("Fetch error:", error);
                    outputContent.innerHTML = `
                        <div class="bg-red-50 border border-red-200 p-4 rounded-lg text-red-700">
                            <h3 class="font-bold">Error Processing Request</h3>
                            <p class="text-sm mt-1">${error.message}</p>
                            <p class="text-xs text-red-500 mt-3 font-semibold">If using GitHub Pages, ensure you perform a Hard Refresh (Ctrl + F5).</p>
                        </div>`;
                } finally {
                    outputBox.classList.remove("ring-2", "ring-blue-400", "ring-offset-2");
                }
            }

            // Function to render and handle the interactive JSON quiz
            function renderInteractiveQuiz(jsonString) {
                try {
                    const quizData = JSON.parse(jsonString);
                    let html = '<div class="space-y-8">';
                    
                    quizData.forEach((q, qIndex) => {
                        html += `
                        <div class="quiz-block bg-white p-6 rounded-xl border border-gray-200 shadow-sm transition" data-answered="false">
                            <h3 class="text-lg font-bold text-gray-800 mb-5">${qIndex + 1}. ${q.question}</h3>
                            <div class="space-y-3">`;
                                
                        q.options.forEach((opt, oIndex) => {
                            const isCorrect = (oIndex === q.correctIndex);
                            html += `<button class="quiz-option w-full text-left p-4 rounded-lg border-2 border-gray-200 hover:border-blue-400 hover:bg-blue-50 font-medium transition duration-200" data-correct="${isCorrect}">
                                        ${opt}
                                     </button>`;
                        });
                        
                        html += `</div></div>`;
                    });
                    html += '</div>';
                    outputContent.innerHTML = html;

                    // Attach click logic for right/wrong grading
                    const blocks = outputContent.querySelectorAll('.quiz-block');
                    blocks.forEach(block => {
                        const options = block.querySelectorAll('.quiz-option');
                        
                        options.forEach(optionBtn => {
                            optionBtn.addEventListener('click', function() {
                                // Prevent answering multiple times per question
                                if (block.dataset.answered === "true") return;
                                block.dataset.answered = "true";

                                const isCorrect = this.dataset.correct === "true";

                                // Grade the entire block visually
                                options.forEach(btn => {
                                    btn.classList.remove('hover:border-blue-400', 'hover:bg-blue-50');
                                    
                                    if (btn.dataset.correct === "true") {
                                        // Highlight correct answer in green
                                        btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                                    } else {
                                        // Dim incorrect answers
                                        btn.classList.add('opacity-50');
                                    }
                                });

                                // If the user clicked the wrong answer, highlight their choice in red
                                if (!isCorrect) {
                                    this.classList.remove('opacity-50');
                                    this.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                                }
                            });
                        });
                    });

                } catch (e) {
                    console.error("JSON Parse Error:", e, jsonString);
                    outputContent.innerHTML = `<p class="text-red-600 font-bold">The AI failed to format the quiz correctly. Please click Create Quiz again.</p>`;
                }
            }

            // 4. Attach Click Listeners
            if (btnQuiz) btnQuiz.addEventListener("click", () => generateContent("quiz"));
            if (btnNotes) btnNotes.addEventListener("click", () => generateContent("notes"));
            if (btnImportant) btnImportant.addEventListener("click", () => generateContent("important"));
        });
    </script>
</body>
</html>
